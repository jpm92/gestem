version: '3.8'

services:
  web:
    build: .
    command: gunicorn gestem.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - sqlite_data:/app/db  # Volumen persistente para SQLite
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:6
    
  celery:
    build: .
    command: celery -A gestem worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  sqlite_data: